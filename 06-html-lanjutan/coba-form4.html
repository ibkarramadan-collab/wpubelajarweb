<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Elemen Form di dalam Tabel</title>
</head>

<body>

  <h1>Contoh elemen-elemen form pada HTML</h1>

  <form action="" method="GET">
    <table>
      <tr>
        <td><label for="nama">Nama:</label></td>
        <td><input type="text" id="nama" name="nama" placeholder="Masukkan nama"></td>
      </tr>
      <tr>
        <td><label for="password">Password:</label></td>
        <td><input type="password" id="password" name="password"></td>
      </tr>
      <tr>
        <td><label for="email">Email:</label></td>
        <td><input type="email" id="email" name="email"></td>
      </tr>
      <tr>
        <td><label for="angka">Angka:</label></td>
        <td><input type="number" id="angka" name="angka"></td>
      </tr>
      <tr>
        <td><label for="tanggal">Tanggal:</label></td>
        <td><input type="date" id="tanggal" name="tanggal"></td>
      </tr>
      <tr>
        <td><label for="warna">Pilih Warna:</label></td>
        <td><input type="color" id="warna" name="warna"></td>
      </tr>
    </table>
    <br>
    <input type="submit" value="Kirim!">
  </form>

</body>

</html>
