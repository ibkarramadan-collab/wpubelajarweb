<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select & Textarea</title>
</head>

<body>

  <form action="" method="GET">
    <h3>Pilih Kota:</h3>
    <select id="kota" name="kota">
      <option value="bdg" selected>Bandung</option>
      <option value="jkt">Jakarta</option>
    </select>

    <h3>About Me:</h3>
    <textarea id="aboutme" name="aboutme" rows="10" cols="50" placeholder="isi data diri anda.."></textarea><br><br>

    <input type="submit" value="Kirim!">
  </form>

</body>

</html>
