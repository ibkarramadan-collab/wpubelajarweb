<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contoh Input Atribut, checkbox & radio</title>
</head>

<body>

  <h1>Contoh Input Atribut, checkbox & radio</h1>

  <form action="" method="GET">
    <label for="nama">Nama:</label>
    <input type="text" id="nama" name="nama" placeholder="Masukkan nama"><br><br>

    <h3>Hobby:</h3>
    <input type="checkbox" id="olahraga" name="hobby1" value="olahraga" checked>
    <label for="olahraga">Olahraga</label><br>
    <input type="checkbox" id="ngoding" name="hobby2" value="ngoding">
    <label for="ngoding">Ngoding</label><br><br>

    <h3>Jenis Kelamin:</h3>
    <input type="radio" id="pria" name="gender" value="pria">
    <label for="pria">Pria</label><br>
    <input type="radio" id="wanita" name="gender" value="wanita">
    <label for="wanita">Wanita</label><br><br>

    <input type="submit" value="Kirim!">
  </form>

</body>

</html>
