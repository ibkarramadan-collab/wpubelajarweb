<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote Berbeda</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 60px 40px;
      text-align: center;
      background-color: #0d1117;
      background-image: url();
    }

    h1 {
      font-size: 45px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 40px;
      color: #f1c40f;

      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: #e67e22;
      text-decoration-thickness: 3px;
      text-shadow: 3px 3px 0px #7f8c8d;
    }

    p {
      font-family: 'Courier New', Courier, monospace;
      font-size: 20px;
      line-height: 2.2;
      color: black solid;
      margin-bottom: 30px;    
    }

    del {
      color: #e74c3c;
    }

    .author {
      font-size: 14px;
      color: gold;
      font-style: impact;
      font-weight: bold;
    }

    body{
      background-image: url(img/laut.jpg
      )
    }
  </style>
</head>

<body>

  <h1>WAKTU BERLALU</h1>

  <p>
    "Semua hal indah perlahan <del>hilang</del>,<br>
    menyisakan kenangan di dalam ruang.<br>
    Apakah kita benar-benar siap berpulang?"
  </p>

  <p class="author">
    - hindia
  </p>

</body>

</html>
