<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote Berbeda</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 40px;
    }

    h1 {
      font-size: 45px;
      font-weight: bold;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 40px;

      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: #2e86de;
      text-decoration-thickness: 3px;
      text-shadow: 3px 3px 0px #747d8c;
    }

    .quote {
      font-family: 'Courier New', Courier, monospace;
      font-size: 20px;
      line-height: 2.2;
      color: #111111;
      margin-bottom: 30px;
    }

    .strikethrough {
      text-decoration: line-through;
    }

    .author {
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      color: #666666;
    }
  </style>
</head>

<body>

  <h1>WAKTU BERLALU</h1>

  <div class="quote">
    "Semua hal indah perlahan <span class="strikethrough">hilang</span>,<br>
    menyisakan kenangan di dalam ruang.<br>
    Apakah kita benar-benar siap berpulang?"
  </div>

  <div class="author">
    - hindia
  </div>

</body>

</html>
