<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote Berbeda</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 80px 40px;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
      background-color: #0d1117;
      background-image:
        linear-gradient(rgba(12, 32, 72, 0.65), rgba(5, 10, 25, 0.85)),
        url(img/laut.jpg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    h1 {
      font-family: 'Courier New', Courier, monospace;
      font-size: 56px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin: 0 0 50px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 0 14px rgba(96, 165, 250, 0.55));
    }

    p {
      font-family: 'Courier New', Courier, monospace;
      font-size: 20px;
      font-weight: bold;
      line-height: 2.2;
      color: #ffffff;
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    del {
      color: #ff4d6d;
      text-decoration: none;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.6);
    }

    .author {
      font-size: 14px;
      font-weight: bold;
      line-height: 1.6;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #94a3b8;
      margin: 50px auto 0;
      padding: 0;
      background: none;
      border: none;
      box-shadow: none;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }

    .author::before {
      content: "";
      display: block;
      width: 60%;
      height: 1px;
      margin: 0 auto 24px;
      background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.6), transparent);
    }
  </style>
</head>

<body>

  <h1>WAKTU BERLALU</h1>

  <p>
    "Semua hal indah perlahan <del>hilang</del>,<br>
    menyisakan kenangan di dalam ruang.<br>
    Apakah kita benar-benar siap berpulang?"
  </p>

  <p class="author">
    - hindia
  </p>

</body>

</html>
