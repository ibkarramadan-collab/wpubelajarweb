<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Background</title>
  <style>
    body {
       background-color: lightblue;
    background-image: linear-gradient(to right, lightblue, lightgreen);
    height: 100vh;

    }
    .kotak1 {
      width: 300px;
      height: 300px;
      background-color: rgb(29, 29, 121);
      background-image: linear-gradient(to bottom, lightblue, salmon);
    }
    .kotak2 {
      width: 300px;
      height: 300px;
      background-color: rgb(29, 29, 121);
      background-image: radial-gradient(blue, red);
    }
    .kotak3 {
      width: 300px;
      height: 300px;
      background-color: rgb(29, 29, 121);
      background-image: conic-gradient(blue, green, red);
    }
    
  </style>
</head>
<body>
  <div class="kotak1"></div>
  <div class="kotak2"></div>
  <div class="kotak3">3</div>
</body>
</html>
