<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Quote Berbeda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      margin: 0;
      padding: 60px 40px;
      text-align: center;
      background-color: #0d1117;
      background-image: url();
    }

    h1 {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 64px;
      font-weight: 400;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 40px;
      color: #f1c40f;

      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: #e67e22;
      text-decoration-thickness: 3px;
      text-shadow: 3px 3px 0px #7f8c8d;
    }

    p {
      font-family: 'Poppins', Arial, sans-serif;
      font-style: normal;
      font-weight: 300;
      font-size: 20px;
      line-height: 2;
      color: black solid;
      margin-bottom: 30px;    
    }

    del {
      color: #e74c3c;
    }

    .author {
      font-family: 'Poppins', Arial, sans-serif;
      font-size: 15px;
      color: gold;
      font-style: normal;
      font-weight: 600;
      letter-spacing: 1px;
    }

    body{
      background-image: url(img/laut.jpg
      )
    }
  </style>
</head>

<body>

  <h1>WAKTU BERLALU</h1>

  <p>
    "Semua hal indah perlahan <del>hilang</del>,<br>
    menyisakan kenangan di dalam ruang.<br>
    Apakah kita benar-benar siap berpulang?"
  </p>

  <p class="author">
    - hindia
  </p>

</body>

</html>
